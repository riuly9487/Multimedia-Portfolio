# Pings Supabase every 3 days so the free project is not paused for inactivity.
name: keepalive
on:
  schedule: [{ cron: '0 6 */3 * *' }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/profile?select=id" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
